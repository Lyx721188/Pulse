[workspace]
resolver = "2"
members = ["pulse-core", "pulse-win"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "json", "system-proxy"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

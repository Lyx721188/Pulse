name: Windows build

# Builds the Windows-native Rust application in `windows/`.

on:
  push:
    branches: ["**"]
    # A windows-v* tag publishes the build as a Release (see the release job).
    tags: ["windows-v*"]
    paths:
      - "windows/**"
      - "README.md"
      - "Docs/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          # The windows-rs crate compiles thousands of feature-gated FFI
          # bindings; without a cache every push pays that cost twice (debug
          # for tests, release for the artifact).

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace
        continue-on-error: true

      - name: Tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      # Smoke test for the status-line contract: `--json` must print a valid
      # document and exit 0 without touching the network or the keyring.
      - name: --json smoke test
        shell: pwsh
        run: |
          $out = & ./target/release/pulse.exe --json | Out-String
          $out | Out-File -FilePath "$env:TEMP\pulse-json.txt" -Encoding utf8
          $json = Get-Content "$env:TEMP\pulse-json.txt" -Raw | ConvertFrom-Json
          if (-not ($json.PSObject.Properties.Name -contains "generatedAt") -or
              -not ($json.PSObject.Properties.Name -contains "accounts")) {
            Write-Host $out
            throw "--json output is not the documented shape"
          }
          Write-Host "smoke test OK: $($json.accounts.Count) account(s) on the rail"

      # WinUI can report a successful launch and still raise a delayed
      # stowed exception while applying the window backdrop. Keep this alive
      # past that point so a release cannot ship a settings window that dies
      # when the tray menu opens it.
      - name: --settings startup smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./target/release/pulse.exe -ArgumentList "--settings" -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "--settings exited with code $($process.ExitCode)"
            }
            Write-Host "settings smoke test OK: process $($process.Id) stayed alive"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      # The build's self-contained step copies the WinAppSDK runtime next to
      # the exe; the settings window cannot start without those DLLs, so the
      # artifact is the whole folder, zipped. (Paths are relative to
      # `windows/`, the job's working directory.)
      - name: Zip the release folder
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/pulse.exe, target/release/*.dll -DestinationPath target/release/pulse-windows-x64.zip -Force
          Write-Host (Get-Item target/release/pulse-windows-x64.zip).Length

      - name: Upload pulse-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: pulse-windows-x64
          path: windows/target/release/pulse-windows-x64.zip
          if-no-files-found: error

  # Tag windows-v1.2.3, and the zip the build job just made becomes a
  # Release. The version for the title comes from the tag itself; the build
  # job remains the single place that decides what a shipped pulse.exe is.
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pulse-windows-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pulse for Windows ${GITHUB_REF_NAME#windows-v}"
          BODY="Windows x64 build of pulse.exe. Requires Windows 10 1809+ or Windows 11."
          BODY="$BODY

          Unzip and run \`pulse.exe\` — the WinAppSDK runtime DLLs it needs travel
          alongside it in the zip. Right-click the tray icon for settings."

          # Re-runnable: a re-tag or a re-run replaces the asset in place
          # instead of failing on an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" pulse-windows-x64.zip --clobber
            echo "Updated existing release $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" pulse-windows-x64.zip \
              --title "$TITLE" \
              --notes "$BODY"
          fi

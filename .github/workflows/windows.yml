name: Windows build

# Builds the Windows-native Rust application in `windows/`.

on:
  push:
    branches: ["**"]
    # A windows-v* tag publishes the build as a Release (see the release job).
    tags: ["windows-v*"]
    paths:
      - "windows/**"
      - "README.md"
      - "Docs/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          # The windows-rs crate compiles thousands of feature-gated FFI
          # bindings; without a cache every push pays that cost twice (debug
          # for tests, release for the artifact).

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace
        continue-on-error: true

      - name: Tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release

      # Smoke test for the status-line contract: `--json` must print a valid
      # document and exit 0 without touching the network or the keyring.
      - name: --json smoke test
        shell: pwsh
        run: |
          $out = & ./target/release/pulse.exe --json | Out-String
          $out | Out-File -FilePath "$env:TEMP\pulse-json.txt" -Encoding utf8
          $json = Get-Content "$env:TEMP\pulse-json.txt" -Raw | ConvertFrom-Json
          if (-not ($json.PSObject.Properties.Name -contains "generatedAt") -or
              -not ($json.PSObject.Properties.Name -contains "accounts")) {
            Write-Host $out
            throw "--json output is not the documented shape"
          }
          Write-Host "smoke test OK: $($json.accounts.Count) account(s) on the rail"

      # The self-contained setup copies DLLs, PRI resource indexes and locale
      # folders next to the exe. All three are required by WinUI at runtime.
      - name: Zip the release folder
        shell: pwsh
        run: |
          $release = (Resolve-Path target/release).Path
          $staging = Join-Path $env:RUNNER_TEMP "pulse-windows-x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item (Join-Path $release "pulse.exe") $staging
          Get-ChildItem $release -File |
            Where-Object { $_.Extension -in ".dll", ".pri" } |
            Copy-Item -Destination $staging
          Get-ChildItem $release -Directory |
            Where-Object { $_.Name -notin ".fingerprint", "build", "deps", "examples", "incremental" } |
            Copy-Item -Destination $staging -Recurse

          $archive = Join-Path $release "pulse-windows-x64.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force
          Write-Host (Get-Item $archive).Length

      # Exercise the files users actually download. Missing PRI files can let
      # WinUI launch and then fail several seconds later with 0xc000027b.
      - name: Packaged --settings smoke test
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "pulse-package-smoke"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Expand-Archive target/release/pulse-windows-x64.zip -DestinationPath $package -Force

          $process = Start-Process -FilePath (Join-Path $package "pulse.exe") -ArgumentList "--settings" -PassThru
          try {
            Start-Sleep -Seconds 20
            $process.Refresh()
            if ($process.HasExited) {
              throw "packaged --settings exited with code $($process.ExitCode)"
            }
            Write-Host "packaged settings smoke test OK: process $($process.Id) stayed alive"
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload pulse-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: pulse-windows-x64
          path: windows/target/release/pulse-windows-x64.zip
          if-no-files-found: error

  # Tag windows-v1.2.3, and the zip the build job just made becomes a
  # Release. The version for the title comes from the tag itself; the build
  # job remains the single place that decides what a shipped pulse.exe is.
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pulse-windows-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pulse for Windows ${GITHUB_REF_NAME#windows-v}"
          BODY="Windows x64 build of pulse.exe. Requires Windows 10 1809+ or Windows 11."
          BODY="$BODY

          Unzip and run \`pulse.exe\` — the WinAppSDK runtime DLLs it needs travel
          alongside it in the zip. Right-click the tray icon for settings."

          # Re-runnable: a re-tag or a re-run replaces the asset in place
          # instead of failing on an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" pulse-windows-x64.zip --clobber
            echo "Updated existing release $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" pulse-windows-x64.zip \
              --title "$TITLE" \
              --notes "$BODY"
          fi
